<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Asselas">
<meta name="theme-color" content="#0b0c10">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<title>Asselas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; -moz-user-select: none; user-select: none;
    -webkit-touch-callout: none; /* 關閉 iOS 長按跳出的複製/查詢選單，避免跟拖曳手勢打架 */
  }
  input, textarea {
    -webkit-user-select: text; -moz-user-select: text; user-select: text;
    -webkit-touch-callout: default;
  }
  html, body {
    background: #0b0c10; color: #e8eaed;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
    overscroll-behavior: none;
    overflow-x: hidden; /* 防禦性保險：就算有元素意外跑出容器外，也不會讓畫布橫向被拉大 */
    touch-action: manipulation; /* 額外防止雙擊縮放這類手勢被誤觸發，跟 viewport meta 形成雙重保護 */
  }
  body { display: flex; justify-content: center; }
  #app {
    width: 100%; max-width: 393px; /* iPhone 16 邏輯寬度 */
    min-height: 100vh; position: relative;
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    padding-bottom: calc(28px + env(safe-area-inset-bottom));
  }
  .wrap { padding: 0 16px; }               /* 左右安全邊距 */
  .topbar {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 30px 16px 18px;
  }
  .eyebrow { font-size: 11px; letter-spacing: 3px; color: #6b7280; margin-bottom: 8px; }
  .networth-row { display: flex; align-items: center; gap: 10px; }
  .networth { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  .eye-btn { background: none; border: none; color: #5b616e; padding: 4px; cursor: pointer; display: flex; align-items: center; margin-top: 6px; }
  .eye-btn:active { transform: scale(.92); }
  .eye-btn.off { color: #3a3f4a; }
  .subline { font-size: 12px; color: #5b616e; margin-top: 4px; }
  .nw-change { font-size: 12px; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .price-status-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .price-status { font-size: 11px; color: #5b616e; }
  .refresh-btn { width: 24px; height: 24px; border-radius: 7px; border: 1px solid #23252e; background: #16181f; color: #8a94a6; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .refresh-btn:active { background: #1c1e26; }
  .refresh-btn.spinning svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .addbtn {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: #5b8def; color: #fff; font-size: 26px; font-weight: 300;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(91,141,239,.4); margin-top: 4px; flex-shrink: 0;
  }
  .addbtn:active { transform: scale(.92); }

  #treemap { position: relative; width: 100%; height: 420px; padding: 0 8px; }
  #treemap-inner { position: relative; width: 100%; height: 100%; }
  .tile {
    position: absolute; padding: 3.5px; cursor: pointer;
    /* 拖曳排列功能已移除，方塊只能點擊，不再需要自己接管 touch 手勢——
       讓瀏覽器用最順的原生方式處理滑動，不用任何 touch-action 限制 */
    transition: left .55s cubic-bezier(.34,1.15,.4,1), top .55s cubic-bezier(.34,1.15,.4,1),
                width .55s cubic-bezier(.34,1.15,.4,1), height .55s cubic-bezier(.34,1.15,.4,1);
  }
  .tile-inner {
    width: 100%; height: 100%; border-radius: 14px;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 12px; overflow: hidden; transition: box-shadow .3s, transform .15s ease;
  }
  .tile-name { font-weight: 700; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.28); text-align: left;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile-pct { font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px rgba(0,0,0,.28); text-align: left; }
  .tile-val { color: rgba(255,255,255,.85); font-variant-numeric: tabular-nums; text-align: left; }

  .section-label { font-size: 11px; letter-spacing: 2px; color: #6b7280; margin: 4px 0 12px; }
  .mode-btn {
    display: flex; align-items: center; gap: 5px;
    border: 1px solid #23252e; background: #16181f; color: #6b7280;
    border-radius: 20px; padding: 5px 11px 5px 9px; font-size: 11px; letter-spacing: 0.5px;
    cursor: pointer; transition: all .15s;
  }
  .mode-btn.on { border-color: #5b8def; background: #5b8def22; color: #a9c3f5; }
  .mode-btn:active { transform: scale(.95); }
  .legend-group { margin-bottom: 16px; }
  .legend-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; }
  .g-name-row { display: flex; align-items: center; gap: 8px; }
  .theme-dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.25); cursor: pointer; padding: 0; }
  .theme-dot:active { transform: scale(.9); }
  .theme-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 4px 0 6px; }
  .theme-swatch { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; padding: 8px 4px; border-radius: 12px; border: 1.5px solid transparent; }
  .theme-swatch.on { border-color: #ffffff55; background: #ffffff0c; }
  .theme-swatch-strip { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; display: grid; grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(2,1fr); }
  .theme-swatch-strip span { display: block; }
  .theme-swatch-label { font-size: 12px; color: #a7adb8; }
  .color-swatch-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 4px 0 14px; }
  .color-swatch { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; padding: 0; }
  .color-swatch.on { border-color: #fff; }
  .color-swatch:active { transform: scale(.92); }
  .target-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .target-btn { display: flex; align-items: center; gap: 8px; border: 1.5px solid #23252e; background: #16181f; color: #a7adb8; border-radius: 12px; padding: 9px 13px; font-size: 14px; cursor: pointer; transition: all .12s; }
  .target-btn:active { transform: scale(.96); }
  .day-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 4px; }
  .day-btn { aspect-ratio: 1; border: 1.5px solid #23252e; background: #16181f; color: #a7adb8; border-radius: 9px; font-size: 13px; font-variant-numeric: tabular-nums; cursor: pointer; transition: all .12s; }
  .day-btn.on { border-color: #5b8def; background: #5b8def33; color: #fff; font-weight: 700; }
  .day-btn:active { transform: scale(.92); }
  .legend-head .g-name { font-size: 12px; color: #6b7280; letter-spacing: 1px; }
  .legend-head .g-val { font-size: 12px; color: #8a94a6; font-variant-numeric: tabular-nums; }
  .legend-head .g-pct { margin-left: 6px; color: #5b616e; font-size: 11px; }
  .legend-items { display: flex; flex-wrap: wrap; gap: 8px 16px; }
  .legend-item { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .legend-item .li-name { font-size: 13px; color: #a7adb8; }
  .legend-item .li-qty { font-size: 11px; color: #5b616e; }

  /* 折線圖 */
  .chart-card { margin: 8px 16px 0; padding: 18px 16px 12px; background: #101218; border-radius: 18px; border: 1px solid #1a1c23; }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .chart-title { font-size: 13px; color: #a7adb8; font-weight: 600; }
  .chart-series-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chart-series-btn { border: 1.5px solid #23252e; background: #16181f; color: #8a94a6; border-radius: 20px; padding: 5px 12px; font-size: 11.5px; font-weight: 600; cursor: pointer; transition: all .12s; display: flex; align-items: center; gap: 5px; }
  .chart-series-btn .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .chart-series-btn.on { border-color: currentColor; }
  .chart-period-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .chart-period-btn { border: none; background: transparent; color: #5b616e; font-size: 11px; font-weight: 600; cursor: pointer; padding: 3px 8px; border-radius: 12px; transition: all .12s; }
  .chart-period-btn.on { color: #e8eaed; background: #20222b; }
  .chart-range { font-size: 11px; color: #5b616e; }
  #sparkline { width: 100%; height: 168px; display: block; touch-action: none; }
  .chart-tooltip {
    position: absolute; top: 4px; pointer-events: none;
    background: #1c1e26f0; border: 1px solid #2a2d38; border-radius: 10px;
    padding: 7px 10px; min-width: 110px; box-shadow: 0 6px 18px rgba(0,0,0,.35);
  }

  /* 底部彈出面板 */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex;
    align-items: flex-end; justify-content: center; z-index: 50; animation: fade .25s ease; }
  .sheet {
    width: 100%; max-width: 393px; background: #16181f; border-radius: 24px 24px 0 0;
    padding: 10px 20px calc(30px + env(safe-area-inset-bottom));
    animation: slideUp .32s cubic-bezier(.34,1.2,.4,1); max-height: 88vh; overflow-y: auto;
  }
  .grabber { width: 40px; height: 4px; background: #3a3d47; border-radius: 2px; margin: 0 auto 20px; }
  .sheet-asset-head { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .sheet-asset-head .sa-name { font-size: 19px; font-weight: 700; }
  .sheet-asset-head .sa-sub { font-size: 13px; color: #6b7280; }
  .dir-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .seg-row { display: flex; gap: 6px; background: #101218; border-radius: 12px; padding: 4px; margin-bottom: 18px; }
  .seg-btn { flex: 1; border: none; border-radius: 9px; padding: 10px 0; font-size: 14px; font-weight: 600; cursor: pointer; background: transparent; color: #6b7280; transition: all .15s; }
  .seg-btn.on { background: #2a2d38; color: #fff; }
  .dir-btn { flex: 1; border: none; border-radius: 11px; padding: 11px 0; font-size: 15px; font-weight: 700; cursor: pointer; background: #22242d; color: #6b7280; transition: all .15s; }
  .dir-btn.add.on { background: #3fb07a; color: #fff; }
  .dir-btn.sub.on { background: #e8804a; color: #fff; }
  .big-input { width: 100%; background: #0e0f13; border-radius: 13px; padding: 15px 16px; color: #fff;
    font-size: 24px; font-weight: 700; outline: none; font-variant-numeric: tabular-nums; }
  .quick-row { display: flex; gap: 8px; margin: 14px 0 4px; }
  .quick-btn { flex: 1; border: 1.5px solid #2a2d38; background: #1c1e26; color: #a7adb8; border-radius: 10px; padding: 9px 0; font-size: 13px; font-weight: 600; cursor: pointer; }
  .primary-btn { width: 100%; border: none; border-radius: 14px; padding: 16px 0; font-size: 17px; font-weight: 700; cursor: pointer; transition: all .15s; margin-top: 18px; }
  .primary-btn:disabled { background: #23252e !important; color: #555b66 !important; cursor: not-allowed; }

  .sheet-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .sheet-desc { font-size: 13px; color: #6b7280; margin-bottom: 20px; }
  .cat-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .cat-btn { flex: 1 1 calc(50% - 4px); min-width: 80px; border: 1.5px solid #23252e; background: #1c1e26; color: #a7adb8; border-radius: 12px; padding: 14px 0; font-size: 14px; font-weight: 700; cursor: pointer; transition: all .15s; }
  .field { margin-bottom: 14px; }
  .field-label { font-size: 12px; color: #6b7280; margin-bottom: 6px; }
  .sm-input { width: 100%; background: #0e0f13; border: 1.5px solid #2a2d38; border-radius: 11px; padding: 12px 14px; color: #fff; font-size: 16px; font-weight: 600; outline: none; font-variant-numeric: tabular-nums; }
  .row2 { display: flex; gap: 10px; }
  .note-sm { font-size: 11px; color: #5b616e; margin: 2px 0 8px; }
  .warn-sm { font-size: 11px; color: #f16a6a; margin: 4px 0 0; }
  .expand-note { animation: fadeIn .3s ease; }
  .del-btn { width: 100%; border: 1.5px solid #3a2020; background: transparent; color: #d9645a; border-radius: 12px; padding: 12px 0; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 10px; }

  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div>
      <div class="eyebrow">淨資產 TWD</div>
      <div class="networth-row">
        <div class="networth" id="networth">0</div>
        <button class="eye-btn" id="eyeBtn" title="隱藏／顯示金額">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="eyeIcon">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <div class="subline" id="subline"></div>
      <div class="nw-change" id="nwChange"></div>
      <div class="price-status-row">
        <span class="price-status" id="priceStatus">—</span>
        <button class="refresh-btn" id="refreshBtn" title="更新即時價">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        </button>
      </div>
    </div>
    <button class="addbtn" id="addBtn">+</button>
  </div>

  <!-- 上區：資產方塊 -->
  <div id="treemap"><div id="treemap-inner"></div></div>

  <!-- 中區：資產變化圖表 -->
  <div class="chart-card">
    <div class="chart-head">
      <span class="chart-title">資產變化</span>
      <span class="chart-range" id="chartRange">近期</span>
    </div>
    <div class="chart-period-row" id="chartPeriodRow"></div>
    <div class="chart-series-row" id="chartSeriesRow"></div>
    <div style="position:relative">
      <svg id="sparkline" viewBox="0 0 340 168" preserveAspectRatio="none"></svg>
      <div class="chart-tooltip" id="chartTooltip" style="display:none"></div>
    </div>
  </div>

  <!-- 下區：詳細資產數字 -->
  <div class="wrap">
    <div class="section-label" style="display:flex;align-items:center;justify-content:space-between">
      <span>組成</span>
      <button class="mode-btn" id="ungroupedBtn" title="不分類群組，依大小混排">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/></svg>
        <span>不分類混排</span>
      </button>
    </div>
    <div id="legend"></div>
  </div>
</div>

<script>
// ── 類別定義 ──
// 8 組精選主題色系，每組 6 階漸層。類別套用某個主題後，
// 底下資產的顏色就從該主題的 6 階裡分配（不管是自動配色還是手動選色都限定在這個範圍內）。
const THEMES = {
  green:  { label:"綠", shades:["#a1edc9","#6de3ac","#3ad98f","#22b470","#1c925b","#156f45"] },
  orange: { label:"橘", shades:["#f8c496","#f5a35c","#f18322","#c9650d","#a3520a","#7d3e08"] },
  purple: { label:"紫", shades:["#c49fef","#a46ae7","#8435de","#661eb8","#531895","#3f1372"] },
  blue:   { label:"藍", shades:["#9bbdf3","#6599ec","#2e74e5","#1858bf","#13479a","#0f3676"] },
  teal:   { label:"青", shades:["#a0eee6","#6ce5d9","#38dccb","#20b6a7","#1a9387","#147167"] },
  red:    { label:"紅", shades:["#eda1ad","#e36d81","#d93a55","#b4223b","#921c2f","#6f1524"] },
  gold:   { label:"金", shades:["#f3d89b","#ecc365","#e5ae2e","#bf8d18","#9a7213","#76570f"] },
  slate:  { label:"灰", shades:["#c0c5ce","#9ea5b3","#7c8598","#5e6778","#4c5361","#3a404a"] },
};
const THEME_ORDER = ["green","orange","purple","blue","teal","red","gold","slate"];

const CATEGORIES = {
  cash:     { label: "銀行帳戶", unit: "",   qtyLabel: "",       priceLabel: "",             theme: "green" },
  crypto:   { label: "虛擬貨幣", unit: "顆", qtyLabel: "持有數量", priceLabel: "現價 (TWD/顆)",   theme: "orange" },
  stock_tw: { label: "台股",     unit: "股", qtyLabel: "持有股數", priceLabel: "股價 (TWD/股)",   theme: "blue" },
  stock_us: { label: "美股",     unit: "股", qtyLabel: "持有股數", priceLabel: "股價 (TWD/股，可先概估)", theme: "red" },
};
// 取得某類別目前主題的調色盤（6 階色階陣列）
function getPalette(cat) { return THEMES[CATEGORIES[cat]?.theme || "green"].shades; }

// 銀行帳戶可選的幣別。新帳戶預設台幣；資料庫裡沒填 currency 的舊資料一律視為台幣（見 currencyOf）。
const CURRENCIES = {
  TWD: { label: "台幣", symbol: "NT$", quick: [1000,5000,10000,50000] },
  USD: { label: "美元", symbol: "US$", quick: [50,100,500,1000] },
  JPY: { label: "日圓", symbol: "¥",   quick: [5000,10000,50000,100000] },
  CNY: { label: "人民幣", symbol: "¥", quick: [200,500,1000,5000] },
  EUR: { label: "歐元", symbol: "€",   quick: [50,100,500,1000] },
  HKD: { label: "港幣", symbol: "HK$", quick: [500,1000,5000,10000] },
  GBP: { label: "英鎊", symbol: "£",   quick: [50,100,500,1000] },
  AUD: { label: "澳幣", symbol: "A$",  quick: [50,100,500,1000] },
};
function currencyOf(a) { return a.currency || "TWD"; }
// 台幣、日圓平常記帳習慣不記到小數（日圓本來就沒有比 1 圓更小的單位），維持整數輸入；
// 其他幣別（美元、歐元…）通常會有角/分，允許輸入小數。
function isWholeCurrency(cur) { return cur === "TWD" || cur === "JPY"; }
// 匯率快取：{ 幣別代碼: 1單位換算成多少台幣 }，由 fetchFxRates() 定期更新（見即時價那段）。
// 抓不到即時匯率時先用這組保底值墊著，不會讓外幣帳戶的淨值整個算不出來。
let fxRates = { TWD:1, USD:32, JPY:0.21, CNY:4.5, EUR:35, HKD:4.1, GBP:41, AUD:21 };
function fxRateOf(cur) { return fxRates[cur] ?? 1; }

// 台股、美股都只能持有整數股（不像加密貨幣可以有小數顆），這裡統一判斷（roundQty 實際捨去邏輯見下方既有函式）
function isWholeShareCat(cat) { return cat === "stock_tw" || cat === "stock_us"; }

const GROUP_ORDER = ["cash","crypto","stock_tw","stock_us"];
const OTHER_COLOR = "#4b515c";
const THRESHOLD = 0.03; // 3% 以下併入「其他」

// 幣種代號 → CoinGecko id（抓即時價用；新增幣種若不在表內會嘗試用小寫代號）
const COINGECKO_IDS = {
  BTC:"bitcoin", ETH:"ethereum", USDT:"tether", USDC:"usd-coin",
  SOL:"solana", BNB:"binancecoin", XRP:"ripple", ADA:"cardano",
  DOGE:"dogecoin", TRX:"tron", DOT:"polkadot", MATIC:"matic-network",

function buildCategoryHistory(cat) {
  const byDateKey = new Map(); // "yyyy-mm-dd" -> {t,v}
  history.forEach(h => {
    if (h.b && h.b[cat] != null) {
      const dateKey = new Date(h.t).toISOString().slice(0,10);
      byDateKey.set(dateKey, { t: h.t, v: Number(h.b[cat]) });
    }
  });
  (categorySnapshotHistory[cat] || []).forEach(s => {
    const dateKey = new Date(s.t).toISOString().slice(0,10);
    if (!byDateKey.has(dateKey)) byDateKey.set(dateKey, s); // breakdown 有資料的日期優先，不覆蓋
  });
  return Array.from(byDateKey.values()).sort((a,b)=>a.t-b.t);
}

// 在 oninput 裡把使用者輸入濾成純數字（或數字+一個小數點）時，用這個函式，不要直接 el.value=...replace(...)。
// 原因：type="number" 的輸入框在 iOS Safari 不支援 selectionStart/setSelectionRange，
// 每次程式重新賦值 .value，瀏覽器都沒辦法保留游標位置，只好把游標丟回最前面——
// 打第二個字就會插到最前面而不是接在後面，越打越亂。
// 修法：這幾個會被重新賦值的輸入框都改成 type="text"（靠 inputmode 顯示數字鍵盤，不靠 type=number 限制格式），
// 這樣就能用 setSelectionRange 手動把游標放回原本相對位置，不會再跳到最左邊。
// 只有真的濾掉了字元、值有變化才動作，值沒變就完全不碰，游標自然不會被打斷。
function filterNumericInput(el, allowDecimal) {
  const before = el.value;
  let cleaned = allowDecimal ? before.replace(/[^\d.]/g,"") : before.replace(/[^\d]/g,"");
  if (allowDecimal) {
    // 只保留第一個小數點，多打的小數點直接吃掉，不然 "1.2.3" 這種會讓 Number() 解析失敗
    const firstDot = cleaned.indexOf(".");
    if (firstDot !== -1) cleaned = cleaned.slice(0, firstDot+1) + cleaned.slice(firstDot+1).replace(/\./g, "");
  }
  if (cleaned === before) return; // 沒有字元被濾掉，值沒變就不要碰，避免不必要的游標跳動
  const pos = el.selectionStart ?? cleaned.length;
  const removedBefore = before.slice(0, pos).length - before.slice(0, pos).replace(allowDecimal ? /[^\d.]/g : /[^\d]/g, "").length;
  el.value = cleaned;
  const newPos = Math.max(0, pos - removedBefore);
  try { el.setSelectionRange(newPos, newPos); } catch(e) { /* type=text 應該都支援，這裡防呆而已 */ }
}

// 精準量測文字實際渲染寬度（用真實內容+字重+字級去量，不用猜的固定門檻）
const _measureCtx = document.createElement("canvas").getContext("2d");
function textWidth(text, weight, size) {
  _measureCtx.font = `${weight} ${size}px -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif`;
  return _measureCtx.measureText(text).width;
}
// 現金：balance 是「原幣別金額」，換算成台幣要乘匯率（台幣本身匯率=1，不受即時匯率抓取失敗影響）
// 其他類別：本來就是台幣計價的 qty × price
const valueOf = a => a.cat === "cash" ? (Number(a.balance||0) * fxRateOf(currencyOf(a))) : a.qty * a.price;
const netWorth = () => assets.reduce((s,a)=>s+valueOf(a),0);
// 「1 單位這個資產值多少台幣」：轉出/定期定額換算數量都靠這個。
// 現金以前固定回傳 1（假設一定是台幣），現在改成該幣別的匯率——外幣帳戶 1 單位不等於 1 台幣。
const unitPriceOf = a => a.cat === "cash" ? fxRateOf(currencyOf(a)) : Number(a.price||0);

// ── squarified treemap ──
// preserveOrder=true 時不依數值重新排序，改用呼叫端給的順序（讓手動拖曳排序生效）
function layoutTreemap(items, x, y, w, h, preserveOrder=false) {
  const total = items.reduce((s,it)=>s+it.value,0);
  if (total <= 0 || w <= 0 || h <= 0) return [];
  const nodes = [];
  let area = {x,y,w,h};
  let remaining = preserveOrder ? [...items] : [...items].sort((a,b)=>b.value-a.value);
  let remTotal = total;
  while (remaining.length) {
    const horizontal = area.w >= area.h;
    const side = horizontal ? area.h : area.w;
    let row=[], rowVal=0, best=Infinity;
    for (let i=0;i<remaining.length;i++){
      const testVal = rowVal + remaining[i].value;
      const rowArea = (testVal/remTotal)*area.w*area.h;
      const rowLen = rowArea/side;
      let worst=0;
      [...row,remaining[i]].forEach(it=>{
        const itLen=(it.value/testVal)*rowLen;
        worst=Math.max(worst,Math.max(rowLen/itLen,itLen/rowLen));
      });
      if (worst<=best){best=worst;row=[...row,remaining[i]];rowVal=testVal;}
      else break;
    }
    const rowArea=(rowVal/remTotal)*area.w*area.h;
    const rowLen=rowArea/side;
    let off=0;
    row.forEach(it=>{
      const itLen=(it.value/rowVal)*side;
      if(horizontal) nodes.push({...it,x:area.x,y:area.y+off,w:rowLen,h:itLen});
      else nodes.push({...it,x:area.x+off,y:area.y,w:itLen,h:rowLen});
      off+=itLen;
    });
    if(horizontal){area.x+=rowLen;area.w-=rowLen;}
    else{area.y+=rowLen;area.h-=rowLen;}
    remTotal-=rowVal;
    remaining=remaining.slice(row.length);
  }
  return nodes;
}

// 小於門檻的資產併成「其他」，再兩層分群佈局
function buildDisplayItems() {
  const nw = netWorth();
  const big = [], small = [];
  assets.forEach(a => {
    if (valueOf(a)/nw < THRESHOLD) small.push(a);
    else big.push(a);
  });
  return { big, small, nw };
}

// ── 手動列陣佈局（取代單純依數值的 squarified，讓拖曳能決定橫排/直排）──
// categoryLayout[cat] = [[assetId,...], [assetId,...], ...]：一個 array 代表一「列」，
// 列內的資產左右並排（橫排），列與列之間上下堆疊（直排）。
// 面積仍照數值比例分配：列高 ∝ 該列數值總和，列內每項寬度 ∝ 該項數值 / 該列總和。
let categoryLayout = {};

// 同一分類底下每一列（例如「銀行帳戶」裡 Line Bank / 彰化銀行各一列）最小高度，
// 避免佔比很小的資產被壓成一條看不出獨立存在感的細線——同樣 7px 的方塊間隙，
// 貼著一條 10px 高的細線看起來就是特別擠，貼著一個 200px 高的方塊完全沒感覺。
// 代價：這一列會比它「應得」的數值比例再高一點，擠壓到同分類裡其他列一點點空間，不再是嚴格的數值比例。
const MIN_ROW_H = 32;

// 把「每列的原始數值」換算成「實際要用的高度」，套用最小高度保護。
// 演算法：反覆找出「照比例分配後還是不到最小高度」的列，先鎖定給它 minH，
// 剩下的列用剩餘高度、剩餘比例重新分配——最多跑 n 輪一定會收斂（每輪至少多鎖定一列，或沒有變化就結束）。
function computeRowHeights(rowValues, totalH, minH) {
  const n = rowValues.length;
  if (n===0) return [];
  const totalValue = rowValues.reduce((s,v)=>s+v,0);
  if (totalValue<=0) return rowValues.map(()=>0);
  if (minH*n > totalH) {
    // 連通通給最小高度都塞不下這個區塊（列數太多或區塊本身太矮）：乾脆平分，不用再算比例
    const equalH = totalH/n;
    return rowValues.map(()=>equalH);
  }
  const heights = new Array(n).fill(0);
  const locked = new Array(n).fill(false);
  let remainingH = totalH, remainingValue = totalValue;
  for (let iter=0; iter<n; iter++) {
    let changed = false;
    for (let i=0;i<n;i++) {
      if (locked[i]) continue;
      const proportional = remainingValue>0 ? remainingH*(rowValues[i]/remainingValue) : 0;
      if (proportional < minH) {
        heights[i]=minH; locked[i]=true;
        remainingH -= minH; remainingValue -= rowValues[i];
        changed = true;
      }
    }
    if (!changed) break;
  }
  for (let i=0;i<n;i++) {
    if (!locked[i]) heights[i] = remainingValue>0 ? remainingH*(rowValues[i]/remainingValue) : 0;
  }
  // 保險：不管上面怎麼算，最後統一校正讓總和精確等於 totalH，不留空隙也不會溢出容器
  const sum = heights.reduce((s,v)=>s+v,0);
  if (sum>0 && Math.abs(sum-totalH)>0.01) {
    const scale = totalH/sum;
    for (let i=0;i<n;i++) heights[i]*=scale;
  }
  return heights;
}

function layoutRows(rows, x, y, w, h) {
  const rowAssetsList = rows
    .map(row => row.map(id => assets.find(a=>a.id===id)).filter(Boolean))
    .map(list => ({ list, value: list.reduce((s,a)=>s+valueOf(a),0) }))
    .filter(r => r.value>0 && r.list.length>0);
  if (!rowAssetsList.length) return [];

  const rowHeights = computeRowHeights(rowAssetsList.map(r=>r.value), h, MIN_ROW_H);

  const nodes = [];
  let curY = y;
  rowAssetsList.forEach((r, i) => {
    const rowH = rowHeights[i];
    let curX = x;
    r.list.forEach(a => {
      const v = valueOf(a);
      const itemW = w * (v/r.value);
      nodes.push({ id:a.id, value:v, ref:a, x:curX, y:curY, w:itemW, h:rowH });
      curX += itemW;
    });
    curY += rowH;
  });
  return nodes;
}

// 讓某類別的 rows 結構跟目前該類別實際顯示的資產同步（新增的資產自動補成新的一列、
// 刪除或被併入「其他」的資產自動移除）。回傳是否有結構變動（供決定要不要存回雲端）。
function ensureCategoryLayout(cat, ids) {
  if (!categoryLayout[cat]) categoryLayout[cat] = [];
  const rows = categoryLayout[cat];
  let changed = false;
  for (let i=rows.length-1; i>=0; i--) {
    const filtered = rows[i].filter(id => ids.includes(id));
    if (filtered.length !== rows[i].length) { rows[i]=filtered; changed=true; }
    if (rows[i].length===0) { rows.splice(i,1); changed=true; }
  }
  const present = new Set(rows.flat());
  ids.forEach(id => { if (!present.has(id)) { rows.push([id]); present.add(id); changed=true; } });
  return changed;
}

function healCategoryLayouts(bigList) {
  GROUP_ORDER.forEach(cat => {
    const idsForCat = bigList.filter(a=>a.cat===cat).map(a=>a.id);
    if (ensureCategoryLayout(cat, idsForCat)) saveCategoryLayout(cat);
  });
}

// 拖曳/存版面時要用的 key：現在只依分類分開存版面（自由排列模式已移除）
function layoutKey(a) { return a.cat; }

// 不分類混排：treemap 不再依四大分類分區塊，全部資產（含「其他」小額整包）直接混在一起，
// 用 squarified treemap 依數值大小排（大的自動排到左上角開始鋪），不受分類限制。
let ungroupedView = false;
try { ungroupedView = localStorage.getItem("assel_ungrouped") === "1"; } catch(e) {}

function layoutGrouped(w, h) {
  const { big, small } = buildDisplayItems();
  const smallVal = small.reduce((s,a)=>s+valueOf(a),0);

  if (ungroupedView) {
    // 不分類群組：所有夠大的資產（不分四大類）直接混在一起丟給 squarified treemap，
    // 演算法本身就是依數值由大到小排、從容器左上角開始鋪，不用另外處理排序。
    const items = big.map(a => ({ id:a.id, value:valueOf(a), ref:a }));
    if (smallVal>0) items.push({ id:"__other__", value:smallVal,
      ref:{ id:"__other__", name:"其他", color:OTHER_COLOR, isOther:true, members:small } });
    return layoutTreemap(items, 0, 0, w, h);
  }

  healCategoryLayouts(big);
  // 分群：各 cat 一區，額外一個 "其他" 區（若有 small）
  const groups = [];
  GROUP_ORDER.forEach(cat => {
    const list = big.filter(a=>a.cat===cat);
    const value = list.reduce((s,a)=>s+valueOf(a),0);
    if (value>0) groups.push({ key:cat, list, value, other:false });
  });
  if (smallVal>0) groups.push({ key:"__other__", list:small, value:smallVal, other:true });

  const gNodes = layoutTreemap(groups.map(g=>({...g,value:g.value})), 0,0,w,h);
  let all=[];
  gNodes.forEach(gn=>{
    if (gn.other) {
      // 其他整區當成一塊（不加額外 padding，縫隙統一由 tile 的 gap 控制）
      all.push({ id:"__other__", value:gn.value, ref:{ id:"__other__", name:"其他", color:OTHER_COLOR, isOther:true, members:gn.list },
        x:gn.x, y:gn.y, w:gn.w, h:gn.h });
    } else {
      // 群組層不加 padding，直接依使用者手動排列的 rows 結構佈局
      const inner = layoutRows(categoryLayout[gn.key] || [], gn.x, gn.y, gn.w, gn.h);
      all=all.concat(inner);
    }
  });
  return all;
}

// ── 渲染 treemap ──
let animatedNW = netWorth();
let lastNodes = []; // 上一次渲染的方塊位置，供拖曳時判斷「拖到哪個方塊上」
let draggingId = null; // 目前正在被拖曳的資產 id（null=沒有在拖）
let lastRenderMode = null; // 上次渲染時是不是「不分類混排」，切換模式當下強制清空重建（見下方）

function renderTreemap() {
  const inner = document.getElementById("treemap-inner");
  // 分類／不分類混排兩種模式的方塊排法差很多，如果沿用舊的 DOM 元素，
  // 一旦中途有任何一個資產處理出狀況導致「清除消失的方塊」那步沒跑到，
  // 殘影就會卡住、兩種模式來回切都清不掉。切換模式的當下乾脆整個清空重建，不沿用任何舊元素，
  // 保證不會有上一個模式（或更早之前、任何原因造成）留下的殘影方塊跨越切換存活下來。
  if (lastRenderMode !== null && lastRenderMode !== ungroupedView) inner.innerHTML = "";
  lastRenderMode = ungroupedView;

  const rect = inner.getBoundingClientRect();
  const W = rect.width, H = rect.height;
  const nodes = layoutGrouped(W, H);
  lastNodes = nodes;
  const nw = netWorth();
  const existing = {};
  inner.querySelectorAll(".tile").forEach(el => existing[el.dataset.id] = el);
  const seen = new Set();

  nodes.forEach(n => {
   // 先加進 seen 再處理內容——就算這個項目後面處理失敗，也不會被誤判成「消失了」而被清除掉一個其實還在的方塊
   seen.add(n.id);
   try {
    const a = n.ref;
    const pct = (n.value/nw)*100;

    // 依方塊「形狀」決定排版，兩種模式都用實際量測文字所需空間來判斷（不用猜的固定門檻）：
    // 1. 先測「直向大字」模式（名稱在上、比例+金額往下疊）真正需要多少寬高
    // 2. 直向放不下，再測「橫向排版」（名稱靠左、數字靠右）真正需要多寬
    // 3. 兩種都放不下，才降級到依面積分級、砍資訊顯示
    // 金額隱藏時完全不顯示金額那一行（顯示一排無意義的圓點沒有用），
    // 量測時也不把它算進去，把省下來的空間留給名稱和百分比，讓它們更容易完整顯示。
    const nameStr = a.isOther ? "其他" : a.name;
    const pctStr = pct.toFixed(1) + "%";
    const showVal = !netWorthHidden;
    const valStr = showVal ? nf(n.value) : "";

    // 直向模式的字級（跟下面 L3 實際渲染用的字級要一致，量測才準）
    const nameSizeCol = a.isOther ? 13 : 16;
    const pctSizeCol = 21;
    const valSizeCol = 11;
    const nameWCol = textWidth(nameStr, 700, nameSizeCol);
    const pctWCol = textWidth(pctStr, 800, pctSizeCol);
    const valWCol = showVal ? textWidth(valStr, 600, valSizeCol) : 0;
    // 直向模式寬度：取各行裡最寬的那個 + 左右內距(12px*2)
    const colNeededW = Math.max(nameWCol, pctWCol, valWCol) + 24;
    // 直向模式高度：各行文字實際佔的高度（字級×行高）加總 + 上下內距(11px*2)
    const colNeededH = (nameSizeCol*1.15) + (pctSizeCol*1.1) + (showVal ? valSizeCol*1.2 : 0) + 22;
    const qualifiesColumnL3 = n.w >= colNeededW && n.h >= colNeededH;

    // 橫向排版的字級與量測（跟下面 wideShort 實際渲染用的字級一致）
    const nameSizeRow = a.isOther ? 14 : 16;
    const pctSizeRow = a.isOther ? 15 : 19;
    const nameW = textWidth(nameStr, 700, nameSizeRow);
    const pctW = textWidth(pctStr, 800, pctSizeRow);
    const valW = showVal ? textWidth(valStr, 600, 11.5) : 0;
    const rightColW = Math.max(pctW, valW); // 金額疊在比例下方，寬度取兩者較大值
    const rowNeededW = nameW + 10 /*名稱與數字間距*/ + rightColW + 32 /*左右內距*/;

    // 直向測過，放不下才測橫向；兩者都放不下才降級
    const wideShort = !qualifiesColumnL3 && n.w >= rowNeededW && n.h >= 34;
    const rowShowVal = showVal && wideShort && n.h >= 46; // 高度也夠兩行時，橫向排版才連金額一起顯示

    const level = (qualifiesColumnL3 || wideShort) ? null :
      (n.w>=56 && n.h>=42) ? 2 :
      (n.w>=40 && n.h>=26) ? 1 : 0;

    let el = existing[n.id];
    if (!el) {
      el = document.createElement("div");
      el.className="tile"; el.dataset.id=n.id;
      el.innerHTML = `<div class="tile-inner"><div class="tile-name"></div><div class="tile-bottom"><div class="tile-pct"></div><div class="tile-val"></div></div></div>`;
      attachTileInteraction(el, a);
      inner.appendChild(el);
    }
    // 正在被拖曳的方塊：位置由拖曳手勢直接控制，渲染迴圈不覆蓋 left/top，避免打架
    if (n.id !== draggingId) {
      el.style.left=n.x+"px"; el.style.top=n.y+"px";
    }
    el.style.width=n.w+"px"; el.style.height=n.h+"px";

    const innerEl = el.querySelector(".tile-inner");
    innerEl.style.background = a.isOther ? "#22252d" : `linear-gradient(145deg, ${a.color}, ${a.color}c4)`;
    innerEl.style.boxShadow = `0 3px 14px ${a.color}2e`;

    const nameEl=el.querySelector(".tile-name");
    const bottom=el.querySelector(".tile-bottom");
    const pctEl=el.querySelector(".tile-pct");
    const valEl=el.querySelector(".tile-val");

    if (wideShort) {
      // 橫向排版：名稱在左、比例+金額在右（金額疊在比例下方、靠右對齊），充分利用寬度
      innerEl.style.flexDirection = "row";
      innerEl.style.alignItems = "center";
      innerEl.style.justifyContent = "space-between";
      innerEl.style.padding = "0 16px";

      nameEl.style.display="block";
      nameEl.textContent = nameStr;
      nameEl.style.fontSize = nameSizeRow+"px";
      nameEl.style.lineHeight = "1.15";
      nameEl.style.color = a.isOther ? "#c8ccd4" : "#fff";
      nameEl.style.flex = "1 1 auto";
      nameEl.style.minWidth = "0"; // 讓 ellipsis 在橫向排版下也能正常截斷

      bottom.style.display = "flex";
      bottom.style.flexDirection = "column";
      bottom.style.alignItems = "flex-end"; // 數字靠右對齊，跟左邊名稱區隔開
      bottom.style.flex = "0 0 auto";
      bottom.style.marginLeft = "10px";

      pctEl.textContent = pctStr;
      pctEl.style.fontSize = pctSizeRow+"px";
      pctEl.style.lineHeight = "1.1";
      pctEl.style.color = a.isOther?"#c8ccd4":"#fff";
      pctEl.style.textAlign = "right";

      valEl.style.display = rowShowVal ? "block" : "none";
      valEl.textContent = valStr;
      valEl.style.fontSize = "11.5px";
      valEl.style.lineHeight = "1.2";
      valEl.style.color = a.isOther?"#8a94a6":"rgba(255,255,255,.85)";
      valEl.style.textAlign = "right";

    } else if (qualifiesColumnL3) {
      // 直向大字：名稱在上、比例+金額往下疊，實測放得下才會走這條分支
      innerEl.style.flexDirection = "column";
      innerEl.style.alignItems = ""; // 重要：橫排模式(wideShort)會把這個設成 center，
                                      // 這裡若不重設，殘留值在直向排版下會變成「水平置中」，就是文字跑到中間的成因
      innerEl.style.justifyContent = "space-between";
      innerEl.style.padding = "11px 12px";
      bottom.style.display = "block";
      bottom.style.flexDirection = "";
      bottom.style.alignItems = "";
      bottom.style.marginLeft = "";
      bottom.style.width = "100%";

      nameEl.style.display="block";
      nameEl.textContent = nameStr;
      nameEl.style.fontSize = nameSizeCol+"px";
      nameEl.style.lineHeight = "1.15";
      nameEl.style.color = a.isOther ? "#c8ccd4" : "#fff";
      nameEl.style.flex = "";
      nameEl.style.minWidth = "";
      nameEl.style.width = "100%";

      pctEl.textContent = pctStr;
      pctEl.style.fontSize = pctSizeCol+"px";
      pctEl.style.lineHeight = "1.1";
      pctEl.style.color = a.isOther?"#c8ccd4":"#fff";
      pctEl.style.textAlign = "left";
      pctEl.style.width = "100%";

      valEl.style.display = showVal ? "block" : "none";
      valEl.textContent = valStr;
      valEl.style.fontSize = valSizeCol+"px";
      valEl.style.lineHeight = "1.2";
      valEl.style.color = a.isOther?"#8a94a6":"rgba(255,255,255,.85)";
      valEl.style.textAlign = "left";
      valEl.style.width = "100%";

    } else {
      // 直向降級：兩種模式都放不下，才依面積分級、砍資訊顯示（level 只會是 2/1/0）
      innerEl.style.flexDirection = "column";
      innerEl.style.alignItems = ""; // 同上，避免殘留 center 造成文字置中
      innerEl.style.justifyContent = "center";
      innerEl.style.padding = level<=1 ? "6px 7px" : "11px 12px";
      bottom.style.display = "block";
      bottom.style.flexDirection = "";
      bottom.style.alignItems = "";
      bottom.style.marginLeft = "";
      bottom.style.width = "100%";

      // 名稱：以前只有「隱藏金額+夠大的 level 2」才會顯示，平常模式下小方塊一律只剩百分比——
      // 分類分區塊時還有顏色群聚當提示（旁邊都是綠的，猜得出是銀行帳戶），但「不分類混排」把這個
      // 提示拿掉了，一個孤零零的百分比色塊完全認不出是誰。.tile-name 本來就有 ellipsis 溢出省略，
      // 放不下會自動截斷成「...」，不用先精算塞不塞得下，所以這裡放寬到 level>=1 就先試著顯示。
      // level 0（真的窄到連一個字都擠不下）才維持純百分比，這是物理空間的極限，不是刻意藏起來。
      const showNameHere = level>=1;
      if (showNameHere) {
        nameEl.style.display="block";
        nameEl.textContent = nameStr;
        nameEl.style.fontSize = (level>=2 ? 12 : 9.5)+"px";
        nameEl.style.lineHeight = "1.15";
        nameEl.style.color = a.isOther ? "#c8ccd4" : "#fff";
        nameEl.style.flex = "";
        nameEl.style.minWidth = "";
        nameEl.style.width = "100%";
      } else {
        nameEl.style.display="none";
      }

      // 比例：所有降級等級都顯示（核心資訊）
      pctEl.textContent = pct.toFixed(1)+"%";
      pctEl.style.fontSize = (level===2?16 : level===1?13 : 10)+"px";
      pctEl.style.lineHeight = "1.1";
      pctEl.style.color = a.isOther?"#c8ccd4":"#fff";
      pctEl.style.textAlign = "left";
      pctEl.style.width = "100%";

      // 金額：L2 顯示，更小就砍；隱藏模式下一律不顯示（不要顯示一排無意義的圓點）
      valEl.style.display = (showVal && level>=2) ? "block" : "none";
      valEl.textContent = valStr;
      valEl.style.fontSize = "10px";
      valEl.style.lineHeight = "1.2";
      valEl.style.color = a.isOther?"#8a94a6":"rgba(255,255,255,.85)";
      valEl.style.textAlign = "left";
      valEl.style.width = "100%";
    }
   } catch(e) {
    // 單一資產渲染失敗不該讓整個 treemap 掛掉——記錄下來，繼續處理剩下的項目，
    // 下面「移除消失的」清理步驟一定會跑到，不會再卡住留下永久殘影
    console.warn("方塊渲染失敗（id="+n.id+"）:", e.message);
   }
  });
  // 移除消失的
  Object.keys(existing).forEach(id=>{ if(!seen.has(id)) existing[id].remove(); });
}

// ── 方塊互動：點擊 = 開啟調整面板（拖曳排列功能已移除，方塊只能點擊，不能拖動調整順序）──
// ── 單一資產的專屬歷史圖：每週快照 + 現在即時值連成線，疊上買賣/編輯事件的 B/S/E 標記 ──
// 刻意不沿用主圖表那套「週五對齊格線」邏輯——這裡是「以資產自己的實際資料點」為準的連續時間軸，
// 事件可能發生在任何一天，硬套週格線會讓標記位置對不準，這是這個畫面自己專屬的座標系統。
let assetHistLayout = null; // 記住這次渲染的座標換算，供手勢查值用
let assetHistScrubbing = false;

// 這個「歷史」分頁固定從這個日期開始累積，不管 asset_snapshots 裡更早以前多零散、
// 甚至混著測試用的雜訊資料——反正 B/S/E 事件本來就是從這個版本才開始記錄，
// 乾脆讓價值線也跟著從同一天起跑，兩者才會是同一套時間軸，不會看起來斷斷續續、資料東一點西一點。
// 這個日期用當天凌晨 0 點固定住，不會每天重新渲染就往後跳，才能真正累積出連續的走勢。
const ASSET_HISTORY_EPOCH = new Date(2026, 7, 25, 0, 0, 0).getTime(); // 2026/8/25
// TODO（之後資料量多了再做）：橫軸縮放/平移，參考 TradingView 那種手勢——現在 tMin/tMax 是單純
// 「epoch 到現在」算出來的，之後要加縮放的話，改成讓使用者手勢決定一組可視範圍、覆蓋掉這裡的
// 預設算法即可，xAt/yAt 這兩個轉換函式不用大改，主要是 tMin/tMax 這兩個值的來源要換掉。

function renderAssetHistoryChart(a) {
  const svg = document.getElementById("assetHistSvg");
  const tip = document.getElementById("assetHistTooltip");
  if (!svg) return;

  const snaps = (assetSnapshotHistory[a.id] || []).map(p => ({ t:p.t, v:p.v })).filter(p => p.t >= ASSET_HISTORY_EPOCH);
  const events = (assetEventHistory[a.id] || []).slice().filter(e => e.t >= ASSET_HISTORY_EPOCH).sort((x,y)=>x.t-y.t);
  const liveV = valueOf(a);
  const now = Date.now();

  // 資料點：epoch 之後的每週快照 + 事件當下的金額 + 現在的即時值，全部一起排時間序連成線。
  // 事件（轉入/轉出/編輯）本來就有精確到當下那一刻的金額，直接當成線上的點，不只是疊加的標記——
  // 這樣只要這個資產有在動，線就會比只靠週五快照密很多，愈常操作、線愈細緻。
  const eventPts = events.filter(e => e.value != null).map(e => ({ t:e.t, v:e.value }));
  const points = [...snaps, ...eventPts, { t: now, v: liveV }].sort((x,y)=>x.t-y.t);

  const W=340, H=190, padL=44, padR=14, padT=16, padB=26;
  const plotW=W-padL-padR, plotH=H-padT-padB;

  const tMin = ASSET_HISTORY_EPOCH;
  const tMax = now;
  const tSpan = Math.max(tMax-tMin, 24*3600*1000); // 避免今天就是 epoch 當天時除以 0

  let maxVal = 0;
  points.forEach(p=>{ if(p.v>maxVal) maxVal=p.v; });
  events.forEach(e=>{ if(e.value!=null && e.value>maxVal) maxVal=e.value; });
  if (maxVal<=0) maxVal=1;

  const xAt = t => padL + ((t-tMin)/tSpan)*plotW;
  const yAt = v => padT + plotH - (v/maxVal)*plotH;

  // Y 軸格線（固定從 0 開始，跟主圖表一致）
  let axisSvg = "";
  [0, maxVal/2, maxVal].forEach(tv=>{
    const y = yAt(tv);
    axisSvg += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#20222b" stroke-width="1"/>`;
    axisSvg += `<text x="${padL-6}" y="${(y+3).toFixed(1)}" fill="#5b616e" font-size="9" text-anchor="end">${netWorthHidden?"•••":formatAxisNum(tv)}</text>`;
  });
  // X 軸：精確到每一天的刻度，不是只有頭尾兩個日期。天數少（一週內）就每天都標；
  // 天數變多之後自動拉開間隔（最多標 7 個左右），避免日期擠成一團看不清楚。
  const fmtDate = t => { const d=new Date(t); return `${d.getMonth()+1}/${d.getDate()}`; };
  const totalDays = Math.max(1, Math.round(tSpan/(24*3600*1000)));
  const dayStep = Math.max(1, Math.ceil(totalDays/7));
  for (let d=0; d<=totalDays; d+=dayStep) {
    const t = tMin + d*24*3600*1000;
    if (t > tMax) break; // 不畫超過今天的刻度，避免把「明天」的日期文字誤標在「今天」的位置上
    const x = xAt(t);
    axisSvg += `<line x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}" y2="${H-padB}" stroke="#1a1c23" stroke-width="1"/>`;
    axisSvg += `<text x="${x.toFixed(1)}" y="${H-6}" fill="#5b616e" font-size="9" text-anchor="middle">${fmtDate(t)}</text>`;
  }
  // 最右邊「今天」的刻度，不管有沒有剛好落在上面的間隔上，一定要標出來
  if ((totalDays % dayStep) !== 0) {
    axisSvg += `<text x="${(W-padR).toFixed(1)}" y="${H-6}" fill="#5b616e" font-size="9" text-anchor="end">今天</text>`;
  }

  if (points.length < 2 && events.length === 0) {
    svg.innerHTML = axisSvg + `<text x="170" y="${padT+plotH/2}" fill="#5b616e" font-size="12" text-anchor="middle">從今天開始累積，之後回來看就有走勢了</text>`;
    assetHistLayout = { W, H, padL, padR, padT, padB, tMin, tMax, tSpan, maxVal, xAt, yAt, points, events, asset:a };
    if (tip) tip.style.display = "none";
    return;
  }

  // 折線本身
  const pts = points.map(p=>[xAt(p.t), yAt(p.v)]);
  let lineSvg = "";
  if (pts.length>=2) {
    const path = smoothPath(pts);
    const area = path + ` L${pts[pts.length-1][0].toFixed(1)} ${(H-padB).toFixed(1)} L${pts[0][0].toFixed(1)} ${(H-padB).toFixed(1)} Z`;
    lineSvg += `<defs><linearGradient id="assetHistGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${a.color}" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="${a.color}" stop-opacity="0"/>
    </linearGradient></defs><path d="${area}" fill="url(#assetHistGrad)"/>`;
    lineSvg += `<path d="${path}" fill="none" stroke="${a.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  pts.forEach(([x,y],i)=>{
    lineSvg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${i===pts.length-1?3.5:2}" fill="${a.color}"/>`;
  });

  // 事件標記：B(買進/轉入)=綠、S(賣出/轉出)=紅、E(編輯)=黃，畫在對應時間點、對應金額的高度上
  const markerColor = { buy:"#3ecf8e", sell:"#f16a6a", edit:"#e8c74a" };
  const markerLabel = { buy:"B", sell:"S", edit:"E" };
  let markerSvg = "";
  events.forEach(e=>{
    const x = xAt(e.t);
    const y = e.value!=null ? yAt(e.value) : (padT+plotH*0.5);
    const col = markerColor[e.type] || "#8a94a6";
    markerSvg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="8" fill="${col}" fill-opacity="0.92" stroke="#0e0f13" stroke-width="1.5"/>`;
    markerSvg += `<text x="${x.toFixed(1)}" y="${(y+3.5).toFixed(1)}" fill="#0e0f13" font-size="9" font-weight="800" text-anchor="middle">${markerLabel[e.type]||"?"}</text>`;
  });

  svg.innerHTML = axisSvg + lineSvg + markerSvg + `<g id="assetHistScrubLayer"></g>`;

  assetHistLayout = { W, H, padL, padR, padT, padB, tMin, tMax, tSpan, maxVal, xAt, yAt, points, events, asset:a };

  if (!svg.dataset.wired) {
    svg.dataset.wired = "1";
    svg.addEventListener("pointerdown", (e)=>{ assetHistScrubbing=true; try{svg.setPointerCapture(e.pointerId);}catch(err){} updateAssetHistScrub(e.clientX); });
    svg.addEventListener("pointermove", (e)=>{ if(assetHistScrubbing) updateAssetHistScrub(e.clientX); });
    svg.addEventListener("pointerup", ()=>{ assetHistScrubbing=false; });
    svg.addEventListener("pointerleave", ()=>{ assetHistScrubbing=false; });
  }
}

function updateAssetHistScrub(clientX) {
  if (!assetHistLayout) return;
  const svg = document.getElementById("assetHistSvg");
  const tip = document.getElementById("assetHistTooltip");
  if (!svg || !tip) return;
  const rect = svg.getBoundingClientRect();
  if (!rect.width) return;
  const { W, padL, padR, padT, H, padB, tMin, tSpan, points, asset } = assetHistLayout;
  const relX = (clientX-rect.left)/rect.width*W;
  const plotW = W-padL-padR;
  const frac = Math.max(0, Math.min(1, (relX-padL)/plotW));
  const t = tMin + frac*tSpan;

  // 找離這個時間點最近的資料點（資料點間距不固定，不能用主圖表那種固定週格子的算法）
  let nearest = points[0], minDiff = Infinity;
  points.forEach(p=>{ const d=Math.abs(p.t-t); if(d<minDiff){minDiff=d;nearest=p;} });

  // 算當時佔淨資產的比例：從 net_worth_history 裡找不晚於這個時間點、離它最近的一筆；
  // 真的找不到（資料比淨值歷史還早）才退而求其次找全部裡離這個時間點最近的
  let nwEntry = null, best=Infinity;
  history.forEach(h=>{ if(h.t<=nearest.t){ const d=nearest.t-h.t; if(d<best){best=d;nwEntry=h;} } });
  if (!nwEntry && history.length) nwEntry = history.reduce((x,y)=> Math.abs(x.t-nearest.t)<Math.abs(y.t-nearest.t) ? x : y);
  const pct = (nwEntry && nwEntry.v>0) ? (nearest.v/nwEntry.v*100) : null;

  const g = document.getElementById("assetHistScrubLayer");
  const x = assetHistLayout.xAt(nearest.t), y = assetHistLayout.yAt(nearest.v);
  if (g) g.innerHTML = `<line x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}" y2="${H-padB}" stroke="#8a94a6" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.5"/>
    <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="${asset.color}" stroke="#0e0f13" stroke-width="1.5"/>`;

  const d = new Date(nearest.t);
  tip.innerHTML = `<div style="font-size:10px;color:#5b616e;margin-bottom:3px">${d.getMonth()+1}/${d.getDate()}</div>
    <div style="font-size:13px;font-weight:700;color:#e8eaed">${mnf(nearest.v)}</div>
    ${pct!=null?`<div style="font-size:11px;color:#8a94a6">佔淨資產 ${pct.toFixed(1)}%</div>`:""}`;
  tip.style.display="block";
  tip.style.top="4px"; tip.style.bottom="auto";
  const relX01 = (clientX-rect.left)/rect.width;
  if (relX01<0.5) { tip.style.left="auto"; tip.style.right="4px"; }
  else { tip.style.left="4px"; tip.style.right="auto"; }
}

function attachTileInteraction(el, assetRef) {
  el.addEventListener("click", () => {
    if (assetRef.isOther) {
      // 「其他」方塊每次渲染都會產生全新的 members 清單，這裡的 assetRef 是建立當下綁定的閉包、
      // 可能是舊資料；改成即時去 lastNodes（每次渲染都會更新）撈最新的一份，避免點開內容過期
      const latest = lastNodes.find(n=>n.id==="__other__");
      openOtherSheet(latest ? latest.ref : assetRef);
    } else {
      openAdjust(assetRef.id);
    }
  });
}

// ── 淨資產數字動畫 ──
let netWorthHidden = false;
try { netWorthHidden = localStorage.getItem("assel_nwHidden") === "1"; } catch(e) {}

function animateNetWorth(to) {
  const el=document.getElementById("networth");
  if (netWorthHidden) { el.textContent = "•••••••"; animatedNW = to; return; }
  const from = animatedNW, dur=550, t0=performance.now();
  function tick(t){
    const p=Math.min((t-t0)/dur,1);
    const e=1-Math.pow(1-p,3);
    el.textContent=nf(from+(to-from)*e);
    if(p<1) requestAnimationFrame(tick); else animatedNW=to;
  }
  requestAnimationFrame(tick);
}

// ── 圖例 ──
function renderLegend() {
  const box=document.getElementById("legend");
  box.innerHTML="";
  const totalNW = netWorth();
  GROUP_ORDER.forEach(cat=>{
    const list=assets.filter(a=>a.cat===cat);
    if(!list.length) return;
    const gv=list.reduce((s,a)=>s+valueOf(a),0);
    const pct = totalNW>0 ? (gv/totalNW*100) : 0;
    const pctText = netWorthHidden ? "••%" : `${pct.toFixed(pct<10?1:0)}%`;
    const g=document.createElement("div"); g.className="legend-group";
    g.innerHTML=`<div class="legend-head">
      <span class="g-name-row">
        <button class="theme-dot" data-cat="${cat}" title="更換 ${CATEGORIES[cat].label} 主題色" style="background:${getPalette(cat)[0]}"></button>
        <span class="g-name">${CATEGORIES[cat].label}</span>
      </span>
      <span class="g-val">${mnf(gv)}<span class="g-pct">${pctText}</span></span>
    </div>`;
    g.querySelector(".theme-dot").addEventListener("click", ()=>openThemePicker(cat));
    const items=document.createElement("div"); items.className="legend-items";
    list.forEach(a=>{
      const it=document.createElement("div"); it.className="legend-item";
      let extra = "";
      if (a.cat==="cash") {
        if (currencyOf(a)!=="TWD") extra = `<span class="li-qty">${CURRENCIES[currencyOf(a)].symbol}${netWorthHidden?"•••":nf(a.balance)}</span>`;
      } else {
        extra = `<span class="li-qty">${a.qty}${CATEGORIES[a.cat].unit}</span>`;
      }
      it.innerHTML=`<span class="swatch" style="background:${a.color}"></span><span class="li-name">${a.name}</span>${extra}`;
      it.addEventListener("click",()=>openAdjust(a.id));
      items.appendChild(it);
    });
    g.appendChild(items); box.appendChild(g);
  });

  // 資料異常區：cat 不是四大分類之一的資產，平常會被上面的 GROUP_ORDER 迴圈整個濾掉、
  // 完全看不到也點不到（只有「不分類混排」不篩 cat 才會露出來，非常難發現）。
  // 這裡額外撈出來獨立列一區，不管在不在混排模式都看得到、點得到，才有機會處理掉。
  const broken = assets.filter(a => !CATEGORIES[a.cat]);
  if (broken.length) {
    const g=document.createElement("div"); g.className="legend-group";
    g.innerHTML=`<div class="legend-head">
      <span class="g-name-row"><span class="g-name" style="color:#d9645a">⚠️ 資料異常（${broken.length}）</span></span>
    </div>`;
    const items=document.createElement("div"); items.className="legend-items";
    broken.forEach(a=>{
      const it=document.createElement("div"); it.className="legend-item";
      it.innerHTML=`<span class="swatch" style="background:${a.color||'#666'}"></span><span class="li-name">${a.name||"(無名稱)"}</span><span class="li-qty">cat: ${a.cat||"(空白)"}</span>`;
      it.addEventListener("click",()=>openAdjust(a.id));
      items.appendChild(it);
    });
    g.appendChild(items); box.appendChild(g);
  }
}

// ── 折線圖：近 24 個月，月度聚合 + 平滑曲線，可切換看總資產或個別大分類 ──
let chartSeries = "total"; // "total" | "cash" | "crypto" | "stock_tw" | "stock_us"
let lastChartLayout = null; // 記住上次渲染的座標換算方式，供手勢滑動查值用
let chartScrubbing = false;

// 把逐筆變動紀錄聚合成「近幾週，每週一個點」
// 規則：每格取「這格結算日當天(含)為止最後一筆」的值；沒有變動就沿用前一格（forward-fill）
// histExtractor：從一筆歷史快照裡取出「這個系列」的值（沒有資料回傳 null，代表這個點跳過不用）
// sourceHistory：資料來源陣列（可以是全域淨值歷史 history，也可以是單一資產的每週快照）
// 週格線以「週五」為結算日對齊——因為 weekly-snapshot.js 的 cron 是每週五才寫入子資產快照，
// 用週五當格線才會跟資料真正落地的日子對上，不會出現週一這種資料根本沒異動的日期。
// 目前這一格（還沒到下一個週五、還在累積中）不做任何即時覆蓋，就是老實 forward-fill 到「現在」
// 已經寫進去的真實資料，標籤顯示今天的日期；等到了下一個週五，才會真正定案往左推一格。

// 圖表週期切換：「6個月」「1年」固定週數；「全部」依實際最早一筆資料動態算，
// 資料還不夠久時至少顯示 26 週（避免「全部」模式在資料很少時看起來反而更短）。
let chartRangeMode = "6m"; // "6m" | "1y" | "all"
try { chartRangeMode = localStorage.getItem("assel_chartRange") || "6m"; } catch(e) {}

function getEarliestDataTime() {
  let earliest = null;
  history.forEach(h => { if (earliest===null || h.t < earliest) earliest = h.t; });
  Object.values(assetSnapshotHistory).forEach(arr => arr.forEach(p => { if (earliest===null || p.t < earliest) earliest = p.t; }));
  return earliest;
}

function chartWeeksForMode(mode) {
  if (mode === "1y") return 52;
  if (mode === "all") {
    const earliest = getEarliestDataTime();
    if (earliest == null) return 26;
    const weeksSince = Math.ceil((Date.now() - earliest) / (7*24*3600*1000)) + 1;
    return Math.max(26, weeksSince);
  }
  return 26; // "6m"（預設）
}

// sourceHistory：資料來源陣列（可以是全域淨值歷史 history，也可以是單一資產的每週快照）
function buildWeeklySeries(sourceHistory, histExtractor) {
  const CHART_WEEKS = chartWeeksForMode(chartRangeMode);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const dow = today.getDay(); // 0=Sun...6=Sat，5=五
  // 找出「最近一個週五」（若今天本身就是週五，這裡就是今天）
  const daysSinceFriday = (dow - 5 + 7) % 7;
  const lastFriday = new Date(today); lastFriday.setDate(today.getDate() - daysSinceFriday);

  const weeks = [];
  for (let i = CHART_WEEKS - 1; i >= 0; i--) {
    const wkEnd = new Date(lastFriday); wkEnd.setDate(lastFriday.getDate() - i*7);
    weeks.push({ end: wkEnd, label: `${wkEnd.getMonth()+1}/${wkEnd.getDate()}` });
  }
  // 今天還沒到本週的週五，就多補一格「還在累積中」的今天，用今天的日期當標籤。
  // 如果今天剛好就是週五，最後一格（lastFriday）跟今天是同一天，不用重複多補。
  if (today.getTime() !== lastFriday.getTime()) {
    weeks.push({ end: today, label: `${today.getMonth()+1}/${today.getDate()}` });
  }

  const sorted = sourceHistory
    .map(h => ({ t: h.t, v: histExtractor(h) }))
    .filter(h => h.v != null)
    .sort((a,b) => a.t - b.t);
  let idx = 0;
  // 一開始是 null，代表「這一格完全沒有紀錄」——不會被誤填成第一筆資料的值、往回一路貼到最早的格。
  // 只有真的碰到第一筆資料之後，才開始 forward-fill（沿用前一筆直到下一次變動）。
  let lastVal = null;
  const series = weeks.map((wk) => {
    const weekEndTime = new Date(wk.end.getFullYear(), wk.end.getMonth(), wk.end.getDate(), 23,59,59,999).getTime();
    while (idx < sorted.length && sorted[idx].t <= weekEndTime) {
      lastVal = sorted[idx].v;
      idx++;
    }
    return { y: wk.end.getFullYear(), m: wk.end.getMonth(), label: wk.label, v: lastVal };
  });
  return series;
}

// 依目前選的系列，回傳 { histExtractor, color, label }
function getChartSeriesConfig(key) {
  if (key === "total") {
    return {
      histExtractor: h => h.v,
      label: "總資產",
    };
  }
  return {
    // 分類的 histExtractor 直接讀 h.v：sourceHistory 這邊改由 buildCategoryHistory(key) 提供，
    // 已經把 net_worth_history.breakdown 跟 asset_snapshots 加總 fallback 合併好了。
    histExtractor: h => h.v,
    label: CATEGORIES[key].label,
    color: getPalette(key)[2], // 用該分類色系中間深淺的一階，跟 treemap 方塊顏色呼應
  };
}

// Catmull-Rom → 平滑貝茲曲線路徑，讓折線圖絲滑不生硬
function smoothPath(pts) {
  if (pts.length < 2) return "";
  if (pts.length === 2) return `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)} L${pts[1][0].toFixed(1)} ${pts[1][1].toFixed(1)}`;
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i === 0 ? 0 : i - 1];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2 < pts.length ? i + 2 : i + 1];
    const c1x = p1[0] + (p2[0] - p0[0]) / 6;
    const c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6;
    const c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}

// 數字轉成座標軸上簡短的顯示文字（例：520000 → 52萬）
function formatAxisNum(v) {
  if (v >= 10000) {
    const w = v/10000;
    return (w>=100 ? w.toFixed(0) : w.toFixed(w>=10?0:1)) + "萬";
  }
  return Math.round(v).toString();
}

// 算某條線「現在當下」的即時值，只用來畫圖表尾端的即時參考標記，不會寫回任何歷史資料，
// 也不會混進 buildWeeklySeries 的線本身——線永遠只呈現已經寫進資料庫的真實紀錄。
function getLiveValueForKey(key) {
  if (key === "total") return netWorth();
  if (key.startsWith("asset:")) {
    const a = assets.find(x => x.id === key.slice(6));
    return a ? valueOf(a) : null;
  }
  return assets.filter(a=>a.cat===key).reduce((s,a)=>s+valueOf(a),0);
}

function renderChart() {
  const svg=document.getElementById("sparkline");
  const seriesRow=document.getElementById("chartSeriesRow");
  const periodRow=document.getElementById("chartPeriodRow");

  // 渲染週期切換按鈕（6個月／1年／全部）
  const PERIOD_OPTIONS = [ ["6m","6個月"], ["1y","1年"], ["all","全部"] ];
  periodRow.innerHTML = PERIOD_OPTIONS.map(([key,label])=>{
    const on = chartRangeMode===key;
    return `<button class="chart-period-btn ${on?'on':''}" data-period="${key}">${label}</button>`;
  }).join("");
  periodRow.querySelectorAll(".chart-period-btn").forEach(btn=>{
    btn.onclick=()=>{
      chartRangeMode=btn.dataset.period;
      try { localStorage.setItem("assel_chartRange", chartRangeMode); } catch(e) {}
      renderChart();
    };
  });

  // 渲染切換按鈕（總資產 + 4 個大分類），只在還沒建立過、或資產類別組成變化時重繪按鈕本身
  const TOTAL_COLOR = "#e8eaed";
  const seriesKeys = ["total", ...GROUP_ORDER];
  seriesRow.innerHTML = seriesKeys.map(key=>{
    const cfg = getChartSeriesConfig(key);
    const dotColor = key==="total" ? TOTAL_COLOR : cfg.color;
    const on = chartSeries===key;
    return `<button class="chart-series-btn ${on?'on':''}" data-key="${key}" style="color:${on?dotColor:'#8a94a6'}">
      <span class="dot" style="background:${dotColor}"></span>${cfg.label}
    </button>`;
  }).join("");
  seriesRow.querySelectorAll(".chart-series-btn").forEach(btn=>{
    btn.onclick=()=>{ chartSeries=btn.dataset.key; renderChart(); };
  });

  if (history.length===0) {
    lastChartLayout = null;
    svg.setAttribute("viewBox","0 0 340 120");
    svg.innerHTML=`<text x="170" y="60" fill="#4b515c" font-size="12" text-anchor="middle">調整資產後這裡會顯示走勢</text>`;
    document.getElementById("chartRange").textContent="—";
    return;
  }

  // 選「總資產」：總資產(主線) + 四個大分類(淡線) 疊在同一張圖
  // 選個別分類（例如台股）：那個分類(主線) + 分類底下每個資產各自的走勢(淡線，用資產自己的顏色)
  const showAll = chartSeries === "total";
  let lines = []; // 統一格式：{ key, label, color, series, isMain }
  if (showAll) {
    lines.push({ key:"total", label:"總資產", color:TOTAL_COLOR,
      series: buildWeeklySeries(history, h=>h.v), isMain:true });
    GROUP_ORDER.forEach(cat=>{
      const cfg = getChartSeriesConfig(cat);
      lines.push({ key:cat, label:cfg.label, color:cfg.color,
        series: buildWeeklySeries(buildCategoryHistory(cat), cfg.histExtractor), isMain:false });
    });
  } else {
    const cat = chartSeries;
    const cfg = getChartSeriesConfig(cat);
    lines.push({ key:cat, label:cfg.label, color:cfg.color,
      series: buildWeeklySeries(buildCategoryHistory(cat), cfg.histExtractor), isMain:true });
    // 子項目：這個分類底下「目前」每一個資產，各自的走勢（資料來源是每週快照 asset_snapshots）
    assets.filter(a=>a.cat===cat).forEach(a=>{
      const assetHist = assetSnapshotHistory[a.id] || [];
      lines.push({ key:"asset:"+a.id, label:a.name, color:a.color,
        series: buildWeeklySeries(assetHist, h=>h.v), isMain:false });
    });
  }
  lines.forEach(ln => { ln.live = getLiveValueForKey(ln.key); });

  const n = lines[0].series.length;

  // 先確認這幾條線裡，有沒有任何一條「至少有一個資料點」（哪怕只有本週這一個點，也該看得到）。
  // 完全一個點都沒有的話（理論上很少發生，因為最新一週永遠會用即時值），才顯示尚無資料。
  const anyDrawable = lines.some(ln => ln.series.some(pt => pt.v != null));
  if (!anyDrawable) {
    lastChartLayout = null;
    svg.setAttribute("viewBox","0 0 340 120");
    svg.innerHTML=`<text x="170" y="60" fill="#4b515c" font-size="12" text-anchor="middle">這個項目還沒有足夠的歷史資料</text>`;
    document.getElementById("chartRange").textContent="—";
    return;
  }

  const W=340, H=168;
  const padL=42, padR=30, padT=14, padB=22; // padR 加寬一點，右邊留給「即時」標記的空間
  const plotW=W-padL-padR, plotH=H-padT-padB;

  // Y 軸固定從 0 開始（不是用這條線自己的 min~max），這樣「完全沒有變化的平線」也會停在
  // 該有的高度，不會因為 max===min 被誤判成貼底。只看有資料(非null)的月份算最大值，
  // 也把「即時」標記的值算進去，不然即時價格比歷史紀錄高的時候，標記會被切到圖表外面。
  let maxVal = 0;
  lines.forEach(ln => {
    ln.series.forEach(pt => { if (pt.v!=null && pt.v > maxVal) maxVal = pt.v; });
    if (ln.live!=null && ln.live > maxVal) maxVal = ln.live;
  });
  if (maxVal <= 0) maxVal = 1;
  const yMax = maxVal * 1.12; // 留一點頭部空間，最高點不會頂到圖表邊緣

  const xAt = i => padL + (i/(n-1))*plotW;
  const yAt = v => padT + (1-(v/yMax))*plotH;

  // 畫 Y 軸格線＋數字（0、一半、最高）
  let axisSvg = "";
  [0, yMax*0.5, yMax].forEach(tv=>{
    const y = yAt(tv);
    axisSvg += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#20222b" stroke-width="1"/>`;
    axisSvg += `<text x="${padL-6}" y="${(y+3).toFixed(1)}" fill="#5b616e" font-size="9" text-anchor="end">${netWorthHidden ? "•••" : formatAxisNum(tv)}</text>`;
  });
  // 畫 X 軸日期標籤（每隔幾格標一次，避免全部擠在一起看不清楚），最右邊「今天」那格一定要標到
  const labelStep = Math.ceil(n/6);
  const labelSeries = lines[0].series;
  for (let i=0;i<n;i+=labelStep) {
    axisSvg += `<text x="${xAt(i).toFixed(1)}" y="${H-6}" fill="#5b616e" font-size="9" text-anchor="middle">${labelSeries[i].label}</text>`;
  }
  if ((n-1) % labelStep !== 0) {
    axisSvg += `<text x="${xAt(n-1).toFixed(1)}" y="${H-6}" fill="#5b616e" font-size="9" text-anchor="middle">${labelSeries[n-1].label}</text>`;
  }

  // 畫每一條線：沒有資料(null)的月份直接跳過不連線，只從「第一筆真的有資料」的月份開始畫，
  // 不會像以前那樣把最早的月份誤畫成一條假的平線。
  // 主線(isMain)：完整不透明、有底色漸層、線比較粗；子項目(分類線 or 個別資產線)：透明度降到 50%、細一點、不加底色。
  let linesSvg = "";
  lines.forEach(ln=>{
    const s = ln.series;
    const firstIdx = s.findIndex(pt => pt.v != null);
    const col = ln.color;
    const opacity = ln.isMain ? 1 : 0.5;
    if (firstIdx === -1) {
      // 完全沒有任何歷史紀錄（例如剛新增、還沒被週五快照收錄過的資產）：
      // 沒有線可畫，但至少把「即時」空心點單獨標出來，不要整條線憑空消失。
      if (ln.live != null) {
        const liveX = W - padR + 16, liveY = yAt(ln.live);
        linesSvg += `<circle cx="${liveX.toFixed(1)}" cy="${liveY.toFixed(1)}" r="${ln.isMain?3.5:2.2}" fill="#0b0c10" stroke="${col}" stroke-width="1.5" stroke-opacity="${opacity}"/>`;
        if (ln.isMain) linesSvg += `<text x="${liveX.toFixed(1)}" y="${(padT-4).toFixed(1)}" fill="${col}" fill-opacity="${opacity}" font-size="8" font-weight="700" text-anchor="middle">即時</text>`;
      }
      return;
    }
    const validPts = [];
    for (let i=firstIdx; i<n; i++) { if (s[i].v!=null) validPts.push([xAt(i), yAt(s[i].v)]); }
    const last = validPts[validPts.length-1];
    if (validPts.length >= 2) {
      // 有兩個點以上，可以連成線
      const line = smoothPath(validPts);
      if (ln.isMain) {
        const area = line + ` L${last[0].toFixed(1)} ${(H-padB).toFixed(1)} L${validPts[0][0].toFixed(1)} ${(H-padB).toFixed(1)} Z`;
        linesSvg += `<defs><linearGradient id="grad-${ln.key.replace(/[^a-zA-Z0-9]/g,'')}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${col}" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="${col}" stop-opacity="0"/>
        </linearGradient></defs>
        <path d="${area}" fill="url(#grad-${ln.key.replace(/[^a-zA-Z0-9]/g,'')})"/>`;
      }
      const strokeW = ln.isMain ? 3 : 1.75;
      linesSvg += `<path d="${line}" fill="none" stroke="${col}" stroke-width="${strokeW}" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="${opacity}"/>`;
    }
    // 不管有沒有連成線，只要有資料（哪怕只有本週這一個點），都要畫出最後一個點的圓點，
    // 不然資料還很少的時候（例如剛開始蒐集），本週的點會完全看不到，像是壞掉一樣。
    linesSvg += `<circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="${ln.isMain?4:2.5}" fill="${col}" fill-opacity="${opacity}"/>`;

    // 「即時」標記：跟上面歷史線分開畫。虛線接到現在的即時值，空心點（不是實心），
    // 一眼就能看出這不是正式記錄，只是現在當下的參考值，不會跟真正的歷史資料混在一起。
    if (ln.live != null) {
      const liveX = W - padR + 16;
      const liveY = yAt(ln.live);
      linesSvg += `<line x1="${last[0].toFixed(1)}" y1="${last[1].toFixed(1)}" x2="${liveX.toFixed(1)}" y2="${liveY.toFixed(1)}" stroke="${col}" stroke-width="1.25" stroke-dasharray="2.5,2.5" stroke-opacity="${opacity*0.85}"/>`;
      linesSvg += `<circle cx="${liveX.toFixed(1)}" cy="${liveY.toFixed(1)}" r="${ln.isMain?3.5:2.2}" fill="#0b0c10" stroke="${col}" stroke-width="1.5" stroke-opacity="${opacity}"/>`;
      if (ln.isMain) {
        linesSvg += `<text x="${liveX.toFixed(1)}" y="${(padT-4).toFixed(1)}" fill="${col}" fill-opacity="${opacity}" font-size="8" font-weight="700" text-anchor="middle">即時</text>`;
      }
    }
  });

  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = axisSvg + linesSvg + `<g id="scrubLayer"></g>`;
  document.getElementById("chartRange").textContent = `${labelSeries[0].label} – ${labelSeries[n-1].label}`;

  // 記住這次渲染的座標換算方式，供手勢滑動查值使用（見 updateChartScrub）
  lastChartLayout = { W, H, padL, padR, padT, padB, n, xAt, yAt, lines, labelSeries };
}

// ── 圖表手勢查值：手指在圖上滑動，顯示十字線 + 該時間點的實際數字（參考股票 K 線圖的價格查看手勢）──
function hideChartScrub() {
  const g = document.getElementById("scrubLayer");
  if (g) g.innerHTML = "";
  const tip = document.getElementById("chartTooltip");
  if (tip) tip.style.display = "none";
}

function updateChartScrub(clientX, clientY) {
  if (!lastChartLayout) return;
  const svgEl = document.getElementById("sparkline");
  const rect = svgEl.getBoundingClientRect();
  if (!rect.width) return;
  const { W, H, padL, padR, padT, padB, n, xAt, yAt, lines, labelSeries } = lastChartLayout;

  // 手指的螢幕座標換算成 SVG 內部座標系（viewBox 跟實際渲染像素大小不一定一樣）
  const relX = (clientX - rect.left) / rect.width * W;
  const plotW = W - padL - padR;
  let idx = Math.round(((relX - padL) / plotW) * (n - 1));
  idx = Math.max(0, Math.min(n - 1, idx));
  const x = xAt(idx);

  const g = document.getElementById("scrubLayer");
  if (!g) return;
  let content = `<line x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}" y2="${H-padB}" stroke="#8a94a6" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.5"/>`;
  lines.forEach(ln=>{
    const pt = ln.series[idx];
    if (pt.v == null) return; // 這個月這條線沒有資料，不畫點
    const y = yAt(pt.v);
    content += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="${ln.color}" stroke="#0e0f13" stroke-width="1.5"/>`;
  });
  g.innerHTML = content;

  // 文字用 HTML 顯示（比 SVG text 好排版、好讀）
  const tip = document.getElementById("chartTooltip");
  if (tip) {
    const rows = lines.map(ln=>{
      const pt = ln.series[idx];
      if (pt.v == null) return "";
      return `<div style="display:flex;align-items:center;gap:6px;padding:2px 0">
        <span style="width:7px;height:7px;border-radius:50%;background:${ln.color};flex-shrink:0"></span>
        <span style="color:#8a94a6;font-size:11px">${ln.label}</span>
        <span style="margin-left:auto;color:#e8eaed;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums">${mnf(pt.v)}</span>
      </div>`;
    }).join("");
    tip.innerHTML = `<div style="font-size:10px;color:#5b616e;margin-bottom:3px">${labelSeries[idx].label}</div>${rows}`;
    tip.style.display = "block";
    // 位置：躲開手指按著的地方。圖表高度才 168，上下閃避讓不開（手指比那個高度還粗），
    // 所以改成左右閃避——手指在左半邊，卡片就整個靠右；手指在右半邊，卡片就整個靠左。
    // 卡片不跟著手指左右移動，固定貼在對側邊緣，這樣手指怎麼滑都不會蓋到數字。
    tip.style.top = "4px";
    tip.style.bottom = "auto";
    const relX01 = (clientX - rect.left) / rect.width;
    if (relX01 < 0.5) {
      tip.style.left = "auto";
      tip.style.right = "4px";
    } else {
      tip.style.left = "4px";
      tip.style.right = "auto";
    }
  }
}

function pushHistory() {
  history.push({ v: netWorth(), t: Date.now() });
  // 不再限制筆數：雲端可能已載入近 24 個月的完整資料，
  // 若砍掉最舊的點會讓月折線圖前段月份失真。
}

// 資料變動後統一呼叫：記歷史 + 存雲端 + 關面板 + 重繪
// 交易事件紀錄：轉入=買進(buy)、轉出=賣出(sell)、其他直接改動(快速增減/編輯內容)=編輯(edit)。
// 這是全新的資料表，從這個版本開始才有紀錄，之前的異動沒有留下痕跡、補不回來。
// 寫入失敗不該擋住資產本身的異動（那才是主要的事），所以這裡永遠不 throw，只記警告。
async function logAssetEvent(assetId, type, { delta=null, valueAtTime=null, counterpartyId=null, counterpartyName=null, assetName=null } = {}) {
  if (!cloudOn()) return;
  try {
    await sb.from("asset_events").insert({
      asset_id: assetId, asset_name: assetName, type,
      delta, value_at_time: valueAtTime,
      counterparty_id: counterpartyId, counterparty_name: counterpartyName,
    });
  } catch(e) { console.warn("交易紀錄寫入失敗（不影響資產本身的異動）:", e.message); }
}

async function commit(changedAsset, opts={}) {
  pushHistory();
  // 等雲端真的存完才關視窗/繼續，避免使用者存完立刻鎖螢幕、切走，
  // 導致背景中的網路請求被中斷、資料根本沒送到雲端（這是之前「新增資產後重開就不見」的成因）
  const tasks = [];
  if (changedAsset && !opts.deleted) tasks.push(withTimeout(saveAssetToCloud(changedAsset), 10000, "資產儲存"));
  if (opts.deleted && changedAsset) tasks.push(withTimeout(deleteAssetFromCloud(changedAsset.id), 10000, "資產刪除"));
  tasks.push(withTimeout(saveNetWorthSnapshot(netWorth()), 10000, "淨值快照")); // 雲端也記一筆淨值快照，供跨裝置折線圖
  // 直接改動（快速增減／編輯內容）算一筆「編輯」事件，刪除或新增資產不算（那些不是「這個部位的持倉變化」）
  if (opts.event && changedAsset && !opts.deleted) {
    tasks.push(logAssetEvent(changedAsset.id, opts.event.type, {
      ...opts.event, assetName: changedAsset.name, valueAtTime: valueOf(changedAsset),
    }));
  }
  await Promise.all(tasks);
  if (!opts.keepSheet) closeSheet();
  renderAll();
}

// 資產互轉專用：一次存兩邊資產（From 扣、To 加），只記一筆歷史快照，避免 commit() 呼叫兩次造成重複記錄
async function commitTransfer(fromAsset, toAsset, fromAmt, toAmt) {
  pushHistory();
  const tasks = [
    withTimeout(saveAssetToCloud(fromAsset), 10000, "轉出來源"),
    withTimeout(saveAssetToCloud(toAsset), 10000, "轉出目標"),
    withTimeout(saveNetWorthSnapshot(netWorth()), 10000, "淨值快照"),
    // 轉出那邊記一筆賣出(sell)，轉入那邊記一筆買進(buy)，互相標記對方是誰，
    // 這樣之後看單一資產的歷史時，才能在線上標出 B/S 符號
    logAssetEvent(fromAsset.id, "sell", { delta: fromAmt, valueAtTime: valueOf(fromAsset), assetName: fromAsset.name, counterpartyId: toAsset.id, counterpartyName: toAsset.name }),
    logAssetEvent(toAsset.id, "buy", { delta: toAmt, valueAtTime: valueOf(toAsset), assetName: toAsset.name, counterpartyId: fromAsset.id, counterpartyName: fromAsset.name }),
  ];
  await Promise.all(tasks);
  closeSheet();
  renderAll();
}


// ── 淨值變化指標：跟「上週五」比較漲跌 ──
// 這裡故意跟下面主圖表用同一套「週五對齊」基準（見 buildWeeklySeries），
// 不要自己另外拿「整整 7 天前」當基準——兩套基準常常不是同一天，資料有變動時
// （例如刪除一筆資產修正了某天的淨值）很容易出現「這裡說漲、下面圖表說跌」的矛盾，
// 對不上的不是資產本身，是兩處拿了不同天的參考點在比較。統一之後兩邊永遠會是同一個答案。
// 資料不夠久（連上週五都還沒有資料）時，不硬凹說「較上週」，改成老實顯示「較 X 天前」。
function renderNetWorthChange() {
  const el = document.getElementById("nwChange");
  if (!el) return;
  if (!history.length) { el.innerHTML = ""; return; }
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const dow = today.getDay();
  // 找「上一個週五」，就算今天剛好是週五，也要往前多推一週，不要抓到「今天自己」——
  // 不然今天是週五時，這裡會變成在跟「今天」比較，比出來的天數趨近於 0，沒有意義。
  let daysSinceFriday = (dow - 5 + 7) % 7;
  if (daysSinceFriday === 0) daysSinceFriday = 7;
  const lastFriday = new Date(today); lastFriday.setDate(today.getDate() - daysSinceFriday);
  const cutoff = new Date(lastFriday.getFullYear(), lastFriday.getMonth(), lastFriday.getDate(), 23,59,59,999).getTime();

  let ref = null;
  history.forEach(h => { if (h.t <= cutoff && (!ref || h.t > ref.t)) ref = h; });
  let usedDays = null; // null 代表「有找到上週五（或更早）的資料」，直接講「較上週」，不用湊天數
  if (!ref) {
    ref = history.reduce((a,b)=> a.t < b.t ? a : b);
    usedDays = Math.max(1, Math.round((now.getTime() - ref.t)/(24*3600*1000)));
    if (ref.t >= now.getTime() - 12*3600*1000) { el.innerHTML = ""; return; } // 唯一一筆資料就是現在，還沒有可比較的過去，先不顯示
  }
  const refVal = ref.v;
  const cur = netWorth();
  if (!(refVal > 0)) { el.innerHTML = ""; return; }
  const diff = cur - refVal;
  const pct = diff/refVal*100;
  const up = diff >= 0;
  const arrow = up ? "▲" : "▼";
  const color = up ? "#3ecf8e" : "#f16a6a";
  const label = usedDays===null ? "較上週" : `較${usedDays}天前`;
  const pctText = `${up?"+":""}${pct.toFixed(1)}%`;
  const diffText = netWorthHidden ? "" : ` (${up?"+":""}${nf(diff)})`;
  el.innerHTML = `<span style="color:${color}">${arrow} ${pctText}</span><span style="color:#5b616e">${diffText} ${label}</span>`;
}
